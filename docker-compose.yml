version: '3.8'

services:
  tasktracker:
    build: tracker/.
    container_name: tracker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
          condition: service_healthy
    env_file:
      - .env

  analytics:
    build: analytics/.
    container_name: analytics
    ports:
      - "9090:9090"
    env_file:
      - .env
    depends_on:
      postgresanalytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: tasktrackerdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${TRACKER_DB_NAME}
      POSTGRES_USER: ${TRACKER_DB_USER}
      POSTGRES_PASSWORD: ${TRACKER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TRACKER_DB_USER} -d ${TRACKER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: ttredis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ttrabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq-main-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgresanalytics:
    image: postgres:15
    container_name: analyticsDb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER} -d ${ANALYTICS_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_analytics_data:
  rabbitmq-data: